name: Generate Hybrid Subscription

on:
  push:
    paths:
      - 'ip.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Combined IP List
        run: |
          # 1. 保留原本的 15 个纯优选 IP（走官方无限流量，不挂住宅代理）
          cp ip.txt sub_nodes.txt
          
          # 2. 提取 ip.txt 里的第一个可用 IP，挂载美国住宅 Socks5（只生成 1 个专用住宅节点）
          FIRST_IP=$(grep -v '^$' ip.txt | head -n 1)
          if [ -n "$FIRST_IP" ]; then
            echo "${FIRST_IP%#*}#🇺🇸 美国静态住宅(计费流量)\$socks5://np79673bvi:eyh5zlhuyZc59jIL@us.isp201.iisp.asia:43164" >> sub_nodes.txt
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sub_nodes.txt
          git commit -m "Auto generate hybrid nodes" || exit 0
          git push
